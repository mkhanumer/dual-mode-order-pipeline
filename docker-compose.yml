# Image version notes:
# - postgres:15-alpine          Airflow 2.9.x supports Postgres 13-16
# - apache/kafka:3.7.0          KRaft mode (no Zookeeper), matches Spark connector
# - bitnami/spark:3.5.1         must match spark-sql-kafka-0-10 package version exactly
# - apache/airflow:2.9.3-py3.11 pinned to Python 3.11 to match etl/ and producer/ containers

version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/docker/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl:ro
    - ./data:/opt/airflow/data:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-init-multi-db.sh:/docker-entrypoint-initdb.d/01-init-multi-db.sh
      - ./postgres/02-create-tables.sql:/docker-entrypoint-initdb.d/02-create-tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # run on-demand: docker compose run --rm etl
  etl:
    build:
      context: ./etl
    container_name: etl_batch_job
    env_file: .env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  producer:
    build:
      context: ./streaming/producer
    container_name: kafka_producer
    env_file: .env
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders_clean
      RAW_DATA_PATH: /data/raw_orders_messy.csv
    volumes:
      - ./data:/data:ro
      - ./etl:/etl:ro
    depends_on:
      kafka:
        condition: service_healthy

  spark_streaming:
    image: bitnami/spark:3.5.1
    container_name: spark_streaming_job
    env_file: .env
    volumes:
      - ./streaming/spark_jobs:/opt/spark_jobs
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      /opt/spark_jobs/spark_streaming_job.py

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    env_file: .env
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
